*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{background:var(--bg);color:var(--label)}
body{font-family:var(--font-ui);font-size:17px;line-height:22px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--sat);z-index:25;background:var(--bg);transition:background-color .2s}
body.nav-solid::before{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
body.staged{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;text-align:inherit}
input,textarea{font:inherit;font-size:17px;color:var(--label)}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0;font-size:inherit;font-weight:inherit}
svg{flex:0 0 auto}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.t-sub{font-size:15px;line-height:20px;color:var(--label-2)}
.t-foot{font-size:13px;line-height:18px;color:var(--label-2)}
.good-t{color:var(--green-t)} .warn-t{color:var(--orange-t)} .bad-t{color:var(--red-t)}
.center{text-align:center;justify-content:center}
.grow{flex:1 1 auto;min-height:8px}
.self-start{align-self:flex-start} .self-center{align-self:center}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrapr{flex-wrap:wrap}

/* ---------- screen shell: sticky nav bar that turns to material, large title ---------- */
.navbar{position:sticky;top:var(--sat);z-index:20;transition:background-color .2s, box-shadow .2s}
.navbar.solid{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep-bar)}
.nb-in{max-width:600px;margin:0 auto;height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-left:max(8px,var(--sal));padding-right:max(8px,var(--sar))}
.nb-title{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.navbar.solid .nb-title{opacity:1}
.nb-l{justify-self:start;display:flex} .nb-r{justify-self:end;display:flex}
.nb-btn{min-width:44px;height:44px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:5px;color:var(--tint);font-size:17px}
.nb-btn:active{opacity:.5}
.sync{color:var(--label-2)} .sync .sync-t{font-size:13px;font-weight:600}
.sync.warn{color:var(--orange-t)} .sync.bad{color:var(--red-t)}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,var(--sal));padding-right:max(16px,var(--sar));padding-block:0 calc(49px + 20px + var(--sab));display:flex;flex-direction:column;gap:24px}
body.has-mini .wrap{padding-bottom:calc(49px + 66px + 36px + var(--sab))}
.large-title{display:flex;flex-direction:column;gap:1px;padding:0 4px}
.lt-eyebrow{font-size:13px;line-height:18px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--label-2)}
.large-title h1{font-family:var(--font-display);font-size:34px;line-height:41px;font-weight:700;letter-spacing:.011em}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px;min-height:28px}
.sec-h h2{font-family:var(--font-display);font-size:22px;line-height:28px;font-weight:700}

/* ---------- inset grouped lists ---------- */
.gsec{display:flex;flex-direction:column;min-width:0}
.gsec+.gsec{margin-top:8px}
.ghead{display:flex;align-items:center;gap:7px;padding:0 16px 7px;font-size:13px;line-height:18px;color:var(--label-2);text-transform:uppercase;letter-spacing:.02em}
.ghead .gh-r{margin-left:auto;text-transform:none;letter-spacing:0}
.gfoot{padding:7px 16px 0;font-size:13px;line-height:18px;color:var(--label-2)}
.group{background:var(--cell);border-radius:12px;overflow:hidden;min-width:0}
.group>*{position:relative}
.group>*+*::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);border-top:.5px solid var(--sep);pointer-events:none;z-index:1}
.cell{display:flex;align-items:center;gap:12px;min-height:44px;padding:11px 16px;width:100%;text-align:left;color:var(--label);font-size:17px;line-height:22px;--inset:16px}
.group>.cell.ic,.group>.cell.ic+*{--inset:60px}
.cell.col{flex-direction:column;align-items:stretch;gap:10px}
.c-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
.c-t{font-size:17px;line-height:22px;overflow-wrap:anywhere}
.c-s{font-size:15px;line-height:20px;color:var(--label-2);overflow-wrap:anywhere}
.c-v{color:var(--label-2);font-size:17px;white-space:nowrap;text-align:right;flex:0 0 auto}
.c-v.strong{color:var(--label);font-weight:600;font-family:var(--font-num)}
.chev{color:var(--label-3);display:inline-flex;margin-right:-4px}
.chev svg,.back svg,.check svg{stroke-width:2.6}
button.cell:active,label.cell:active{background:var(--cell-hl)}
.cell.tint{color:var(--tint)} .cell.danger{color:var(--red-t)} .cell.center{justify-content:center}
.cell[disabled]{opacity:.4;pointer-events:none}
.cell .check{color:var(--tint);visibility:hidden;display:inline-flex}
.cell[aria-pressed="true"] .check{visibility:visible}
.cell>.seg{flex:1 1 auto}
.itile,.wtile{width:29px;height:29px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:var(--on-color);background:var(--c);flex:0 0 auto}
.wtile{color:var(--c-on,var(--on-color))}
.wtile{font-family:var(--font-num);font-weight:700;font-size:15px;line-height:1}
.wtile.big{width:38px;height:38px;border-radius:10px;font-size:18px}
.plate{width:10px;height:10px;border-radius:50%;flex:0 0 auto;background:var(--c);display:inline-block}
.plate.ring{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.rcheck{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--gray);display:inline-flex;align-items:center;justify-content:center;color:transparent;flex:0 0 auto;transition:background-color .15s}
.cell[aria-pressed="true"] .rcheck{background:var(--accent);box-shadow:none;color:var(--on-accent)}
.rcheck svg{stroke-width:3}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:25px;font-size:17px;line-height:22px;font-weight:600;text-align:center;transition:opacity .15s}
.btn:active{opacity:.65}
.btn-lg{min-height:54px;border-radius:27px}
.btn-primary{background:var(--primary-bg);color:var(--on-primary)}
.btn-tinted{background:var(--tint-bg);color:var(--tint)}
.btn-gray{background:var(--fill-3);color:var(--label)}
.btn-sm{min-height:32px;padding:0 13px;border-radius:16px;font-size:15px;gap:5px}
.btn-block{width:100%}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn-plain{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 8px;color:var(--tint);font-size:17px}
.btn-plain:active{opacity:.5}
.btn-plain.danger{color:var(--red-t)}
.round-btn{width:52px;height:52px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--fill-3);color:var(--label);flex:0 0 auto;transition:background-color .15s}
.round-btn.sm{width:46px;height:46px}
.round-btn:active{background:var(--fill)}
.icon-tap{width:36px;height:36px;border-radius:18px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.icon-tap.tint{color:var(--tint);background:var(--tint-bg)} .icon-tap.danger{color:var(--red-t);background:var(--red-bg)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--seg-bg);border-radius:9px;padding:2px;min-height:32px}
.seg button{position:relative;min-height:28px;border-radius:7px;font-size:13px;line-height:18px;font-weight:500;color:var(--label);text-align:center;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background-color .2s}
.seg button+button::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:1px;background:var(--fill);transition:opacity .2s}
.seg button[aria-pressed="true"]{background:var(--seg-sel);font-weight:600;box-shadow:var(--seg-shadow)}
.seg button[aria-pressed="true"]::before,.seg button[aria-pressed="true"]+button::before{opacity:0}
.seg button[disabled]{opacity:.35}
.seg.lg{min-height:36px} .seg.lg button{min-height:32px;font-size:15px}
.scale5 button{font-family:var(--font-num);font-size:16px}
.scale-wrap{display:flex;flex-direction:column;gap:6px}
.scale-ends{display:flex;justify-content:space-between;font-size:13px;line-height:16px;color:var(--label-2);padding:0 2px}
.switch{position:relative;width:51px;height:31px;border-radius:16px;background:var(--switch-off);flex:0 0 auto;transition:background-color .25s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:var(--knob);box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .25s cubic-bezier(.3,.7,.3,1)}
.switch[aria-checked="true"]{background:var(--switch-on)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.stepper{display:inline-grid;grid-template-columns:46px 46px;height:32px;border-radius:8px;background:var(--fill-3);overflow:hidden;flex:0 0 auto}
.stepper button{position:relative;display:flex;align-items:center;justify-content:center;color:var(--label)}
.stepper button+button::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:1px;background:var(--fill)}
.stepper button:active{background:var(--fill)}
.stepper button[disabled]{color:var(--label-3);pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:0 9px;border-radius:12px;font-size:13px;line-height:18px;font-weight:600;background:var(--fill-3);color:var(--label-2);white-space:nowrap}
.pill.good{background:var(--green-bg);color:var(--green-t)} .pill.warn{background:var(--orange-bg);color:var(--orange-t)} .pill.bad{background:var(--red-bg);color:var(--red-t)} .pill.tint{background:var(--tint-bg);color:var(--tint)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 14px;border-radius:17px;background:var(--fill-3);color:var(--label);font-size:15px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.pill-in{-webkit-appearance:none;appearance:none;border:0;border-radius:8px;background:var(--fill-3);color:var(--label);font-size:17px;line-height:22px;padding:5px 10px;min-height:34px;font-family:var(--font-ui);font-variant-numeric:tabular-nums;min-width:0}
.ta{display:block;width:100%;min-height:96px;border:0;background:transparent;color:var(--label);padding:11px 16px;font-size:17px;line-height:22px;resize:vertical}
.ta::placeholder{color:var(--gray)}
.ta:focus-visible{outline:0}
.meter{height:8px;border-radius:4px;background:var(--fill-3);overflow:hidden}
.meter>span{display:block;height:100%;border-radius:4px;background:var(--accent)}
.meter>span.good{background:var(--green)}
.card{background:var(--cell);border-radius:16px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.card-t{font-size:17px;line-height:22px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--cell);border-radius:16px;padding:12px 14px 13px;display:flex;flex-direction:column;gap:1px;min-width:0}
.tile-l{font-size:13px;line-height:18px;color:var(--label-2)}
.tile-v{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:27px;line-height:33px;overflow-wrap:anywhere}
.tile-s{font-size:13px;line-height:18px;color:var(--label-2)}

.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--cell);color:var(--label-2);font-size:15px;line-height:20px}

/* ---------- tab bar, mini player ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep-bar);padding-left:max(16px,var(--sal));padding-right:max(16px,var(--sar));padding-bottom:var(--sab)}

.tip-sub{font-size:12px;color:var(--label-2);margin-top:2px;white-space:normal;max-width:220px}
.tip .key{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.tip .faint{color:var(--label-2)}
.scroller{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.scroller::-webkit-scrollbar{display:none}
.tbl{width:100%;border-collapse:collapse;font-size:15px;line-height:20px}
.tbl td{padding:10px 0;border-top:.5px solid var(--sep);vertical-align:top}
.tbl tr:first-child td{border-top:0}
.tbl td:first-child{color:var(--label-2);white-space:nowrap;padding-right:12px;width:1%}
.tbl td:last-child{text-align:right;font-family:var(--font-num);font-weight:600;white-space:nowrap;padding-left:10px}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:62px 1fr 24px;gap:10px;align-items:center;font-size:15px;line-height:20px}
.hbar-t{height:8px;border-radius:4px;background:var(--fill-3);overflow:hidden}
.hbar-t>span{display:block;height:100%;background:var(--accent);border-radius:4px}
.hbar b{font-family:var(--font-num);text-align:right;font-weight:600}
.group details summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:11px 16px;font-size:17px;line-height:22px}
.group details summary::-webkit-details-marker{display:none}
.group details summary .chev svg{transition:transform .2s}
.group details[open] summary .chev svg{transform:rotate(90deg)}
.group details p{padding:0 16px 14px;color:var(--label-2);font-size:15px;line-height:21px}

/* ---------- pickers, text fields, week pager ---------- */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:14px 8px;padding:14px 12px;justify-items:center}
.swatch{width:36px;height:36px;border-radius:50%;background:var(--sw);display:inline-flex;align-items:center;justify-content:center;color:var(--sw-on,var(--on-color));transition:transform .15s}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--cell),0 0 0 4.5px var(--sw)}
.swatch svg{opacity:0;stroke-width:3}
.swatch[aria-pressed="true"] svg{opacity:1}
.swatch:active{transform:scale(.9)}
.text-in{display:block;width:100%;border:0;background:transparent;color:var(--label);font-size:17px;line-height:22px;padding:11px 16px;font-family:var(--font-ui);min-height:44px}
.text-in::placeholder{color:var(--gray)}
.text-in:focus-visible{outline:0}
.wk-pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.wk-pager::-webkit-scrollbar{display:none}
.wk-pager>.wk{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always}
.pg-dots{display:flex;justify-content:center;gap:7px;padding-top:10px}
.pg-dots span{width:6px;height:6px;border-radius:50%;background:var(--fill);transition:background-color .2s}
.pg-dots span.on{background:var(--label-2)}
.wedit-head{display:flex;align-items:center;gap:12px;padding:0 4px}
.wedit-head .wtile.big{width:52px;height:52px;border-radius:13px;font-size:24px}

/* «Как выполнять» */
.ht-btn{gap:6px}
.st-head .ht-btn{margin-top:8px}
.set-meta .ht-btn{margin-left:auto}
.ht-body{display:flex;flex-direction:column;gap:22px}
.ht-media{display:flex;flex-direction:column;gap:10px}
.ht-photo{position:relative;width:100%;aspect-ratio:3/2;border-radius:12px;overflow:hidden;background:var(--cell);cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.ht-fr{position:absolute;inset:0;background-size:200% 100%;background-repeat:no-repeat;opacity:0;transition:opacity .45s ease}
.ht-fr.a{background-position:0 0} .ht-fr.b{background-position:100% 0}
.ht-photo.ready .ht-fr.a, .ht-photo.ready.f1 .ht-fr.b{opacity:1}
.ht-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;color:var(--label-2);font-size:15px;line-height:20px}
.ht-photo.ready .ht-msg{display:none}
.ht-spin{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--fill);border-top-color:var(--label-2);animation:htspin .9s linear infinite}
@keyframes htspin{to{transform:rotate(360deg)}}
.ht-ctrl{display:flex;align-items:center;gap:8px}
.ht-ctrl .seg{flex:1 1 auto}
.ht-play{width:36px;height:36px;border-radius:18px;background:var(--fill-3);color:var(--label);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.ht-play:active{opacity:.6}
.ht-note{display:flex;gap:8px;align-items:flex-start;margin-top:-10px;font-size:13px;line-height:18px;color:var(--label-2);padding:0 4px}
.ht-note svg{flex:0 0 auto;margin-top:1px;color:var(--tint)}
.ht-head{display:flex;flex-direction:column;gap:6px;padding:0 4px}
.ht-head h2{font-family:var(--font-display);font-size:24px;line-height:30px;font-weight:700;text-wrap:balance}
.ht-head p{font-size:15px;line-height:21px;color:var(--label-2)}
.ht-mus{display:flex;flex-direction:column;gap:8px;padding:12px 16px 14px}
.ht-mus-l{font-size:13px;line-height:18px;color:var(--label-2)}
.ht-chips{display:flex;flex-wrap:wrap;gap:6px}
.ht-chip{display:inline-flex;align-items:center;min-height:30px;padding:0 12px;border-radius:15px;background:var(--fill-3);color:var(--label);font-size:15px;line-height:20px}
.ht-chip.prim{background:var(--tint-bg);color:var(--tint);font-weight:600}
.group>.ht-row{--inset:52px}
.group>.ht-row.plain{--inset:16px}
.ht-row{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;font-size:16px;line-height:22px;color:var(--label)}
.ht-n{flex:0 0 24px;height:24px;margin-top:-1px;border-radius:12px;background:var(--tint-bg);color:var(--tint);font-family:var(--font-num);font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.ht-x{flex:0 0 24px;height:24px;margin-top:-1px;display:inline-flex;align-items:center;justify-content:center;color:var(--red-t)}
.ht-x svg{stroke-width:2.8}
.group>.cell.split{padding:0;gap:0;align-items:stretch}
.split-main{display:flex;align-items:center;gap:14px;flex:1 1 auto;min-width:0;padding:11px 4px 11px 0;text-align:left;color:var(--label)}
.st-btn{flex:0 0 auto;display:inline-flex;align-items:center;padding:0 14px 0 16px}
.st-ic{transition:transform .15s}
.st-btn:active .st-ic{transform:scale(.84)}
.st-ic.pop{animation:stpop .4s cubic-bezier(.2,.9,.3,1.35)}
@keyframes stpop{0%{transform:scale(.5)}100%{transform:scale(1)}}
.sheet.tall{height:calc(100% - var(--sat) - 10px)}
.note-ta{min-height:120px;resize:none}
.note-prev{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wcard{position:relative}
.w-hide{position:absolute;top:8px;right:10px;min-height:36px;padding:0 10px;border-radius:18px;color:var(--tint);font-size:15px}
.w-hide:active{opacity:.5}
/* the whole row goes gray when its main part is pressed, not only the middle */
.cell.split:has(.split-main:active){background:var(--cell-hl)}
.info-btn{flex:0 0 auto;width:50px;display:inline-flex;align-items:center;justify-content:center;color:var(--tint)}
.info-btn:active{opacity:.5}

/* drag to reorder */
.sortable>*{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.group.sorting{overflow:visible}
.sorting>*{transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.sorting>.lifted{transition:none;z-index:5;background:var(--cell-hl);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.38)}
.sorting>.lifted::before,.sorting>.lifted+*::before{opacity:0}
.group>.unit{display:block;padding:0}
.unit>*{position:relative}
.unit>*+*::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--sep);pointer-events:none;z-index:1}
.sec-toggle{display:inline-flex;align-items:center;gap:6px;font:inherit;color:inherit;padding:0;min-height:28px}
.sec-chev{display:inline-flex;color:var(--label-3)}
.sec-chev svg{stroke-width:2.6;transition:transform .2s}
.sec-toggle[aria-expanded="true"] .sec-chev svg{transform:rotate(90deg)}
.group>.bld-ord{--inset:52px}
.bld-ord .grip{display:inline-flex;color:var(--label-3);flex:0 0 auto}
.bld-mus .c-t{font-weight:600}

.cell.disclose .chev svg{transition:transform .2s}
.cell.disclose[aria-expanded="true"] .chev svg{transform:rotate(90deg)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  .cel-check circle,.cel-check path{stroke-dashoffset:0}
}

/* v9: safety net, recovery */
.mini-l.warn-t{color:var(--orange-t)}
.meter>span.warn{background:var(--orange)}
.rec-row{gap:8px}
.rec-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.rec-when{flex:0 0 auto;font-size:15px;line-height:20px;font-weight:600;color:var(--label-2)}
.hero-row.duo{grid-template-columns:auto minmax(0,1fr)}
.hero-row.duo .btn{padding:0 14px;gap:6px}
.rec-s{font-size:13px;line-height:18px;color:var(--label-2)}
.sync-card{background:var(--cell);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sync-card .sc-h{display:flex;align-items:center;gap:10px;font-size:17px;line-height:22px;font-weight:600}
.sync-card .sc-h svg{flex:0 0 auto;color:var(--orange-t)}
.sync-card.ok{padding:12px 16px;flex-direction:row}
.sync-card.ok .sc-h{font-weight:400;font-size:15px;line-height:20px;color:var(--label-2)}
.sync-card.ok .sc-h svg{color:var(--green-t)}
.sync-card .sc-t{font-size:15px;line-height:20px;color:var(--label-2)}
.sync-card .sc-b{display:flex;gap:10px;flex-wrap:wrap}
.sync-card .sc-b .btn{flex:1 1 auto}
.hero-note .btn-sm{flex:0 0 auto}
.stale-card .stale-why{margin:0;font-size:15px;line-height:20px;color:var(--label)}

/* v10: quick row, exercise card, settings pages, pace, runs */
.quick{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.q-btn{display:flex;align-items:center;gap:10px;min-height:58px;padding:9px 12px;border-radius:16px;background:var(--cell);color:var(--label);text-align:left;min-width:0}
.q-btn:active{background:var(--cell-hl)}
.q-ic{flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--fill-3);color:var(--label-2)}
.q-btn.todo .q-ic{background:var(--tint-bg);color:var(--tint)}
.q-btn.todo .q-t{color:var(--tint)}
.q-main{display:flex;flex-direction:column;min-width:0}
.q-t{font-size:16px;line-height:21px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-s{font-size:13px;line-height:17px;color:var(--label-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmark{width:6px;height:6px;flex:0 0 auto;display:inline-block;background:var(--label-2);border-radius:1.5px;transform:rotate(45deg) scale(.86)}
.legend .cmark{width:8px;height:8px}
.mini-time.over{color:var(--orange-t)}
.xc-tabs{position:sticky;top:0;z-index:3;display:flex;flex-direction:column;gap:8px;margin:-6px -16px 0;padding:6px 16px 10px;background:var(--sheet-bg)}
.xc-body,.xc-set{display:flex;flex-direction:column;gap:22px}
.xc-where{display:flex;align-items:center;gap:10px;font-size:15px;line-height:20px;color:var(--label-2);padding:0 4px}
.xc-link{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;min-width:0;color:var(--label)}
.xc-link:active{opacity:.6}
.sess-item.tap{cursor:pointer}
.sess-item.tap:active{background:var(--cell-hl)}
.si-r{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.si-r .chev{margin-right:-4px}
.nb-back{gap:1px;padding:0 8px 0 0}
.pace{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:.5px solid var(--sep)}
.pace-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:15px;line-height:20px;color:var(--label-2)}
.pace-v{font-size:17px;font-weight:700;color:var(--label)}
.pgauge{position:relative;height:10px;border-radius:5px;background:var(--fill-3);margin:4px 0 2px}
.pg-zone{position:absolute;top:0;bottom:0;border-radius:5px;background:var(--green-bg);box-shadow:inset 0 0 0 1px var(--green)}
.pg-zero{position:absolute;top:-3px;bottom:-3px;width:1.5px;margin-left:-.75px;background:var(--label-3)}
.pg-dot{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--tint);box-shadow:0 0 0 2.5px var(--cell)}
.rec-hint{margin-bottom:12px}
.rec-hint svg{color:var(--orange-t)}
.hint.ok{background:var(--tint-bg)}
.hint.ok svg{color:var(--tint)}
.imp-ta{min-height:150px}
.imp-report{display:flex;flex-direction:column;gap:16px}
.gfoot.warn-t{color:var(--orange-t)}
html,body{overscroll-behavior:none}
.cal-wrap+.btn{margin-top:-8px}
.cal-up{margin-top:-8px}
.sheet-in.kb-space{padding-bottom:calc(360px + var(--sab))}
.stage.kb-space .stage-in{padding-bottom:360px}

/* v11: the second button on Today + its press-and-hold menu */
.hero-cfg{min-width:0}
.hero-cfg .hc-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm-title{padding:10px 16px 8px;font-size:13px;line-height:18px;color:var(--label-2);border-bottom:.5px solid var(--as-sep)}
.pm-item{display:flex;align-items:center;gap:8px;width:100%;min-height:52px;padding:9px 16px 9px 10px;text-align:left;color:var(--label);border-top:.5px solid var(--as-sep)}
.pmenu>.pm-item:first-child,.pm-title+.pm-item{border-top:0}
.pm-item:active{background:var(--fill-4)}
.pm-check{flex:0 0 20px;display:flex;justify-content:center;color:var(--tint)}
.pm-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
.pm-t{font-size:17px;line-height:22px}
.pm-s{font-size:13px;line-height:17px;color:var(--label-2)}
.pm-ic{flex:0 0 auto;color:var(--label)}

const REPS_EN = ['rep', 'reps'], SETS_EN = ['set', 'sets'];

function pl(n, ru, en) { return LANG === 'en' ? (Math.abs(n) === 1 ? en[0] : en[1]) : plural(n, ru); }

/* dates (local) */
const MONTHS_G = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MONTHS_N = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
const MONTHS_S = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const WD_FULL = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
const WD_SHORT = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
const ds = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const todayDs = () => ds(new Date());
function pd(s) { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2], 12); }
function addDays(s, n) { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); }
function diffDays(a, b) { return Math.round((pd(b) - pd(a)) / 864e5); }
function mondayOf(s) { const d = pd(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ds(d); }
const EN_MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const EN_MONTHS_S = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const EN_WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const EN_WD_S = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const wdShort = i => T(WD_SHORT[i], EN_WD_S[i]);
const wdFull = i => T(WD_FULL[i], EN_WD[i]);
const monthName = i => T(MONTHS_N[i], EN_MONTHS[i]);
function dayMonth(s) { const d = pd(s); return T(d.getDate() + ' ' + MONTHS_G[d.getMonth()], EN_MONTHS[d.getMonth()] + ' ' + d.getDate()); }
function dayLong(s) { return wdFull(pd(s).getDay()) + ', ' + dayMonth(s); }
function dayShort(s) { const d = pd(s); return T(WD_SHORT[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS_S[d.getMonth()], EN_WD_S[d.getDay()] + ', ' + EN_MONTHS_S[d.getMonth()] + ' ' + d.getDate()); }
function dateShort(s) { const d = pd(s); return T(d.getDate() + ' ' + MONTHS_S[d.getMonth()], EN_MONTHS_S[d.getMonth()] + ' ' + d.getDate()); }
function hhmm(ts) { const d = new Date(ts); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function fmtDM(ts) { const d = new Date(ts); return T(pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1), (d.getMonth() + 1) + '/' + d.getDate()); }
const byTime = (a, b) => (a.time || '').localeCompare(b.time || '');
const byDT = (a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || ''));

/* ---------- the phone's own press-and-hold menu ----------
   In the app (1.0.6 and later, with only the app on screen) a press and hold on a button with a menu is the iPhone's
   own context menu: the button rises in its own shape, the screen blurs, a finger slides to a pick — drawn by iOS

function holdZone(id, el) {

function holdZonesSoon() { if (!HoldZ.raf) HoldZ.raf = requestAnimationFrame(() => { HoldZ.raf = 0; holdZonesSend(); }); }

/* workouts (done or planned) on the days next to a date */
function workoutsOnDay(d) { return all('sessions').filter(s => s.date === d).map(s => s.workoutId).concat(all('plans').filter(p => p.date === d && !p.done).map(p => p.workoutId)); }
function workoutsAround(date) { return workoutsOnDay(addDays(date, -1)).concat(workoutsOnDay(addDays(date, 1))); }
function rotationFrom(w) { const out = [w]; let x = w; for (let i = 0; i < ROTATION.length - 1; i++) { x = nextInRotation(x); if (out.indexOf(x) < 0) out.push(x); } return out; }
function sharedMuscles(a, b) { const A = wMuscles(a), B = wMuscles(b); return Object.keys(A).filter(k => B[k]).sort((x, y) => Math.min(B[y], A[y]) - Math.min(B[x], A[x])).slice(0, 3); }
/* rotation order for the chosen days, rearranged (fewest swaps) so that workouts on the same muscles never land on
   neighbouring days — among the chosen days or next to workouts already in the calendar */
function planAssign(days, time) {
  if (!days.length) return { plan: [] };
  let prev = lastWorkoutBefore(days[0], time); const seq = [];
  for (let i = 0; i < days.length; i++) { const w = prev ? nextInRotation(prev) : 'A'; seq.push(w); prev = w; }
  const memo = {}; const conf = (a, b) => { const k = a + '|' + b; if (!(k in memo)) memo[k] = wConflict(a, b); return memo[k]; };
  const around = days.map(d => ({ before: workoutsOnDay(addDays(d, -1)), after: workoutsOnDay(addDays(d, 1)) }));
  const cost = perm => {
    let c = 0;
    perm.forEach((w, i) => {
      if (i > 0 && diffDays(days[i - 1], days[i]) === 1 && conf(perm[i - 1], w)) c += 100;
      around[i].before.concat(around[i].after).forEach(x => { if (conf(x, w)) c += 100; });
      if (w !== seq[i]) c += 1;
    });
    return c;
  };
  let best = seq.slice(), bestC = cost(seq);
  const counts = {}; seq.forEach(w => { counts[w] = (counts[w] || 0) + 1; });
  const cur = [];
  const walk = () => {
    if (cur.length === seq.length) { const c = cost(cur); if (c < bestC) { bestC = c; best = cur.slice(); } return; }
    for (const w of Object.keys(counts)) { if (!counts[w]) continue; counts[w]--; cur.push(w); walk(); cur.pop(); counts[w]++; }
  };
  if (seq.length <= 7) walk();
  const plan = days.map((d, i) => ({ d: d, w: best[i] }));
  let clash = null;
  plan.forEach((x, i) => {
    if (clash) return;
    if (i > 0 && diffDays(plan[i - 1].d, x.d) === 1 && conf(plan[i - 1].w, x.w)) clash = [plan[i - 1].w, x.w];
    else { const o = around[i].before.concat(around[i].after).find(y => conf(y, x.w)); if (o) clash = [o, x.w]; }
  });
  return { plan: plan, clash: clash, moved: best.some((w, i) => w !== seq[i]) };
}

/* ---------- История ---------- */
function exBest(exId) {

  if (!sets.length) return null;
  let best, txt;
  if (ex.kind === 'w') { best = sets.reduce((b, x) => (x.s.w > b.s.w || (x.s.w === b.s.w && x.s.reps > b.s.reps) ? x : b), sets[0]); txt = kgTxt(best.s.w) + ' × ' + best.s.reps; }
  else if (ex.kind === 'assist') { best = sets.reduce((b, x) => (x.s.w < b.s.w ? x : b), sets[0]); txt = T('прот. ', 'cw ') + kgTxt(best.s.w) + ' × ' + best.s.reps; }
  else { best = sets.reduce((b, x) => (x.s.reps > b.s.reps ? x : b), sets[0]); txt = nReps(best.s.reps) + (best.s.w ? ' +' + kgTxt(best.s.w) : ''); }

}

    const pool = [item.progEx].concat(item.pool.filter(x => x !== item.progEx));

    setKids(box,
      nvMark(h('div', { class: 'xc-where' }, wtile(wid), h('span', null, T('В тренировке «', 'In “') + wName(wid) + T('»', '”'))),
        { row: () => ({ k: 'row', id: 'where', lead: { k: 'badge', t: wLetter(wid), c: nvColor(plateVar(wid)), on: nvColor(plateOnVar(wid)) }, t: T('В тренировке «', 'In “') + wName(wid) + T('»', '”') }) }),

      ladder ? gsec(T('Подходы и повторы', 'Sets and reps'), group(cell({ t: T('Лесенка ГТО', 'GTO ladder'), s: T('4 подхода, +1 повтор каждую тренировку, без отказа.', '4 sets, +1 rep every workout, never to failure.') }))) : gsec(T('Подходы и повторы', 'Sets and reps'), group(
        stepperCell(T('Подходов', 'Sets'), { value: sets, min: 1, max: 6, step: 1, fmt: String, onChange: v => { sets = v; dirty(); } }),
        stepperCell(T('Повторы: от', 'Reps: from'), { value: lo, min: 1, max: 30, step: 1, fmt: String, onChange: v => { lo = v; dirty(); if (hi < lo) { hi = lo; draw(); } } }),
        stepperCell(T('Повторы: до', 'Reps: to'), { value: hi, min: 1, max: 40, step: 1, fmt: String, onChange: v => { hi = Math.max(v, lo); dirty(); } }))),
      gsec(T('Отдых', 'Rest'), group(stepperCell(T('Между подходами', 'Between sets'), { value: rest, min: 30, max: 300, step: 15, fmt: clock, onChange: v => { rest = v; dirty(); } })),
        rb.sec ? T('Сейчас к нему само добавляется +' + rb.sec + ' с: повторы падали к последнему подходу.', 'Right now +' + rb.sec + ' s is added on its own: your reps dropped by the last set.') : null),
      ex.kind === 'w' || ex.kind === 'assist' ? gsec(T('Шаг веса, кг', 'Weight step, kg'), seg([0.5, 1, 1.25, 2, 2.5, 5].map(v => ({ v: v, t: fmtKg(v) })), step, v => { step = v; dirty(); }, 'lg'), T('Минимальная прибавка на этом снаряде.', 'The smallest increase on this machine.')) : null,
      group(h('button', { type: 'button', class: 'cell tint center', onclick: reset }, isCustom(wid) ? T('Вернуть по умолчанию', 'Reset to default') : T('Вернуть как в программе', 'Reset to program default'))),
      isCustom(wid) ? group(h('button', { type: 'button', class: 'cell danger center', onclick: () => { if (removeFromCustom(wid, key)) sh.close(); } }, T('Убрать из тренировки', 'Remove from the workout'))) : null);
  };

    h('span', { class: 'pg-zone', style: { left: pos(tg.lo), width: 'calc(' + pos(tg.hi) + ' - ' + pos(tg.lo) + ')' } }),
    h('span', { class: 'pg-zero', style: { left: pos(0) } }),
    h('span', { class: 'pg-dot', style: { left: pos(r) } }));
}

  return nvMark(h('div', { class: 'pace' }, head(fmtSigned(g.r, 2) + T(' кг/нед', ' kg/wk'), g.state === 'ok' ? 'good' : 'warn'), paceGauge(g.r, tg), h('p', { class: 't-foot' }, tip)),

/* =====================================================================
   Apple Health through the Shortcuts app (12.13; the iPhone app 1.0.30+ says health: true in its hello, 1.0.32+
   also hands over when each distance sample ended). The app can't read Health itself (iloader signs it without
   HealthKit), so a shortcut does: «Найти образцы Здоровья» for sleep (an Apple Watch or a sleep app writes it — an
   iPhone alone hasn't since iOS 18) and walking + running distance (the iPhone itself), and with a watch heart rate
   variability (ВСР), resting pulse and running speed — handed to the app's action «Передать данные из «Здоровья»»
   by an automation when the app opens (and/or every morning). The app passes it here ({type:'health', items}) and
   this works out:
   - the nights: sleep samples (in bed / asleep / core / deep / REM / awake) grouped into sessions (a break of more
     than 2 h starts a new one); each stage counted once even when the phone and the watch both wrote it (overlaps
     merged); asleep = core + deep + REM, or plain «asleep» when there are no stages, or — some sleep apps (and iPhones
     before iOS 18) write only «В кровати» — the time in bed (bedOnly: no stages, no quality). The night of a day is the longest
     sleep that ended that day before 15:00; other sleep that day of an hour or more counts as a nap;
   - the sleep quality 1–5 from the stages: the deep and REM shares, time awake in bed, awakenings;
   - the night's ВСР (the samples during that night) and the day's resting pulse;
   - the runs: running speed (the watch writes it only during a run) marks when you ran; without it, a stretch of
     8+ min where the distance samples say 7+ km/h (iPhone's pedometer; 1.5+ km at 7.5+ km/h on average). How far:
     the distance in that time, at each moment from the fastest sample covering it (the phone and the watch both
     write distance — this counts the same metres once).
   A night goes into metrics[day] like a manual entry (sleepH, sleepQ) with the details in hk; a night entered by
   hand (sleepManual) keeps its numbers; a later batch with less of the same night (its search window cut the
   beginning) doesn't shrink it. A run goes into cardio once (id hk-…), not over a run logged by hand then.
   ===================================================================== */
ICONS.heart = '<path d="M12 20.2s-7.6-4.5-7.6-10.1A4.3 4.3 0 0 1 12 7.4a4.3 4.3 0 0 1 7.6 2.7c0 5.6-7.6 10.1-7.6 10.1z"/>';
function healthReady() { return !!NATIVE && !!Native.hello && !!Native.hello.health; }

/* the sleep sample's value → stage (Health in Russian or English, or HealthKit's own number) */
function hkStage(v) {
  const s = String(v === null || v === undefined ? '' : v).trim().toLowerCase();
  if (/^[0-5]$/.test(s)) return ['bed', 'asleep', 'awake', 'core', 'deep', 'rem'][+s];
  if (/rem|быстр/.test(s)) return 'rem';
  if (/deep|глубок/.test(s)) return 'deep';
  if (/core|light|основн|лёгк|легк|ядр/.test(s)) return 'core';
  if (/awake|бодрств|пробужд|не спал/.test(s)) return 'awake';
  if (/bed|кроват|постел/.test(s)) return 'bed';
  if (/asleep|sleep|сон|спит|спал/.test(s)) return 'asleep';
  return null;
}
/* time intervals [start, end] (ms): merged and sorted; their total length; the parts of a outside b */
function hkMerge(iv) {
  const a = iv.filter(x => x[1] > x[0]).sort((x, y) => x[0] - y[0]); const out = [];
  for (const x of a) { const l = out[out.length - 1]; if (l && x[0] <= l[1]) l[1] = Math.max(l[1], x[1]); else out.push([x[0], x[1]]); }
  return out;
}
const hkLen = iv => sum(iv.map(x => x[1] - x[0]));
function hkMinus(a, b) {
  const out = [];
  for (const x of a) {
    let pieces = [[x[0], x[1]]];
    for (const y of b) pieces = pieces.flatMap(p => (y[1] <= p[0] || y[0] >= p[1]) ? [p] : [[p[0], y[0]], [y[1], p[1]]].filter(q => q[1] > q[0]));
    pieces.forEach(p => out.push(p));
  }
  return out;
}
/* the sleep sessions in the samples */
function hkSessions(sl) {
  const n = Math.min(sl.v.length, sl.s.length, sl.e.length); const seg = [];
  for (let i = 0; i < n; i++) { const st = hkStage(sl.v[i]); const s = +sl.s[i], e = +sl.e[i]; if (st && e > s && e - s < 20 * 36e5) seg.push({ st: st, s: s, e: e }); }
  seg.sort((a, b) => a.s - b.s); const sessions = [];
  for (const x of seg) { const l = sessions[sessions.length - 1]; if (l && x.s <= l.e + 2 * 36e5) { l.seg.push(x); l.e = Math.max(l.e, x.e); } else sessions.push({ s: x.s, e: x.e, seg: [x] }); }
  const out = [];
  for (const ss of sessions) {
    const by = st => hkMerge(ss.seg.filter(x => x.st === st).map(x => [x.s, x.e]));
    const deep = by('deep'), rem = by('rem'), core = by('core'), awake = by('awake'), bed = by('bed'), plain = by('asleep');
    const staged = hkMerge(deep.concat(rem, core));
    /* when the watch wrote stages, a plain «asleep» from the phone over the same time isn't counted again; with only
       «В кровати» (some sleep apps, iPhones before iOS 18) the time in bed is the night */
    const bedOnly = !staged.length && !plain.length;
    const sleepIv = staged.length ? staged : plain.length ? plain : bed;
    const asleep = hkLen(sleepIv);
    if (asleep < (bedOnly ? 60 : 20) * 60e3) continue;
    const start = sleepIv[0][0], end = sleepIv[sleepIv.length - 1][1];
    const inBed = hkLen(bed.length ? hkMerge(bed.concat(sleepIv)) : [[start, end]]);
    /* awake: written as such, or the gaps between stretches of sleep; an awakening is a break of 3+ min */
    const gaps = []; for (let i = 1; i < sleepIv.length; i++) gaps.push([sleepIv[i - 1][1], sleepIv[i][0]]);
    const awakeIv = hkMerge(hkMinus(awake, sleepIv).concat(gaps));
    const wake = gaps.filter(g => g[1] - g[0] >= 3 * 60e3).length;
    out.push({ date: ds(new Date(end)), start: start, end: end, asleep: asleep, inBed: Math.max(inBed, asleep), deep: hkLen(deep), rem: hkLen(rem), core: hkLen(core),
      awake: hkLen(awakeIv), wake: wake, staged: !!staged.length, bedOnly: bedOnly, endH: new Date(end).getHours() });
  }
  return out;
}
/* quality 1–5 from what the stages say (typical night: deep 13–23 %, REM 20–25 %, awake under a tenth of the time
   in bed, a few short awakenings); only time in bed says nothing about how you slept — no quality then */
function hkQuality(n) {
  if (n.bedOnly) return null;
  let q = 3;
  if (n.staged) {

   with iOS's own components: the tab bar at the bottom and the workout list. The page stays the brain: it tells the
   app what to show (tabs, workout) and does what the app asks (wact) with the same functions as its own buttons.
   While the app's workout list is up the page goes see-through (html.nunder): only its sheets show, over the app's
   screen (overlay). Everywhere else — Claude, Safari, older apps — nothing here does anything.

function nativeTabs() {

  if (!on) { if (Native.sent.tabs && Native.sent.tabs !== 'off') { Native.sent.tabs = 'off'; nativeSend({ type: 'tabs', show: false, items: [] }); } return; }
  /* a sheet of the page covers the bar, the way a sheet covers it in iOS. The app 1.0.15+ lays the page over the bar
     while a sheet is up (overlay); older ones put the bar away */
  const msg = { type: 'tabs', show: !stageVisible() && (nvOn() || !pageSheetOpen()), tab: UI.tab, items: NTABS.map(t => ({ id: t[0], title: T(t[1], t[2]), sf: t[3] })) };
  const k = JSON.stringify(msg); if (Native.sent.tabs === k) return; Native.sent.tabs = k;

/* how much of the bottom of the screen the app's tab bar covers (with the home indicator); while a sheet has put
   the bar away the page keeps its room for it, so nothing jumps behind the sheet */
function nativeTabBarHeight(px) {
  px = Math.max(0, Math.round(+px || 0));

  document.documentElement.style.setProperty('--tabh', px + 'px');
}
