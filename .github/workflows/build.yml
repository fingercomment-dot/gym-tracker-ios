name: Build

# Every push that changes the iPhone app builds a fresh .ipa (unsigned — SideStore signs it with your Apple ID),
# publishes it as a release and adds it to source.json, so SideStore can update the app by itself.
on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/build.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Version
        id: ver
        run: |
          BASE=$(tr -d ' \n\r' < ios/VERSION)
          echo "version=$BASE.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Version $BASE.${{ github.run_number }}"

      - name: Make the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        working-directory: ios
        run: |
          if ! xcodebuild build \
              -project GymTracker.xcodeproj \
              -scheme GymTracker \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              MARKETING_VERSION=${{ steps.ver.outputs.version }} \
              CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.build }} \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              > build.log 2>&1; then
            echo "::group::Errors"
            grep -E "error:|fatal|\*\* BUILD FAILED" -A4 build.log | head -150 || true
            echo "::endgroup::"
            tail -40 build.log
            exit 1
          fi
          grep -E "warning:" build.log | grep -v "/build/" | sort -u | head -60 || true
          tail -5 build.log

      - name: Make the .ipa
        run: |
          APP=ios/build/Build/Products/Release-iphoneos/GymTracker.app
          test -d "$APP/PlugIns/GymWidgets.appex" || { echo "The widget extension is missing"; ls -la "$APP"; exit 1; }
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry GymTracker.ipa Payload)
          ls -la out

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log
          if-no-files-found: ignore

      - name: Keep the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: GymTracker-${{ steps.ver.outputs.version }}
          path: out/GymTracker.ipa

      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.ver.outputs.version }}
          NOTES=$(git log -1 --pretty=%B | sed -e '/^Co-Authored-By:/d' -e '/^Claude-Session:/d')
          gh release create "v$V" out/GymTracker.ipa --title "Gym Tracker $V" --notes "$NOTES" --latest

      - name: Tell SideStore about the new version
        if: github.ref == 'refs/heads/main'
        run: |
          V=${{ steps.ver.outputs.version }}
          python3 .github/scripts/update_source.py "$V" "${{ steps.ver.outputs.build }}" out/GymTracker.ipa "${{ github.repository }}" "$(git log -1 --pretty=%s)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "SideStore: version $V" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done

  # The app in the iPhone simulator on its test page: opens the wheels and the press-and-hold menu, takes pictures
  # and puts them (with the log and any crash report) on the "ci-shots" release, so they can be looked at before
  # anyone installs the build.
  uitest:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Make the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          xcrun simctl list devices available --json > sims.json
          UDID=$(python3 - <<'PY'
          import json, re
          d = json.load(open("sims.json"))["devices"]
          best = None
          for rt, devs in d.items():
              if ".iOS-" not in rt:
                  continue
              ver = tuple(int(x) for x in re.findall(r"\d+", rt.split(".iOS-")[-1]))
              for dv in devs:
                  if not dv["name"].startswith("iPhone"):
                      continue
                  pref = 1 if re.match(r"iPhone 1[6-9]( |$)", dv["name"]) else 0
                  key = (ver, pref, dv["name"])
                  if best is None or key > best[0]:
                      best = (key, dv["udid"])
          print(best[1] if best else "")
          PY
          )
          echo "Simulator: $UDID"
          grep -B2 -A2 "$UDID" sims.json | head -8 || true
          test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run the UI checks
        working-directory: ios
        run: |
          set +e
          xcodebuild test \
            -project GymTracker.xcodeproj \
            -scheme GymTracker \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build-test \
            -resultBundlePath ../ui.xcresult \
            -skip-testing:GymTrackerUITests/GymTrackerUITests/test4SplitTabs \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES \
            > ../uitest.log 2>&1
          STATUS=$?
          grep -E "error:|failed|crash|Crash|Test Case|\*\* TEST" ../uitest.log | tail -60
          echo "xcodebuild exit: $STATUS"
          # the «60/40» check with the simulator's screen recorded: the tab switches are looked at frame by frame
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" > /dev/null 2>&1 || true
          xcrun simctl io "${{ steps.sim.outputs.udid }}" recordVideo --codec=h264 --force ../split.mp4 > ../rec.log 2>&1 &
          REC=$!
          sleep 3
          xcodebuild test-without-building \
            -project GymTracker.xcodeproj \
            -scheme GymTracker \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build-test \
            -resultBundlePath ../ui4.xcresult \
            -only-testing:GymTrackerUITests/GymTrackerUITests/test4SplitTabs \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES \
            > ../uitest4.log 2>&1
          STATUS4=$?
          kill -INT $REC 2>/dev/null; sleep 4
          grep -E "error:|failed|crash|Crash|Test Case|\*\* TEST" ../uitest4.log | tail -20
          echo "split check exit: $STATUS4"
          # what failed, as annotations (they can be read through the API even where the logs can't)
          echo "::notice title=uitest::checks exit $STATUS, split check exit $STATUS4, video $(ls -la ../split.mp4 2>/dev/null | awk '{print $5}') bytes"
          grep -hE "error: -\[|: error: |Test Case .* failed" ../uitest.log ../uitest4.log | head -20 | while IFS= read -r line; do
            echo "::warning title=uitest::$(printf '%s' "$line" | sed -e 's/^.*GymTrackerUITests\.swift:/swift:/' | cut -c1-350)"
          done
          if [ "$STATUS" = "0" ]; then STATUS=$STATUS4; fi
          echo "$STATUS" > ../uitest.status

      - name: Collect the pictures
        if: always()
        run: |
          mkdir -p shots
          xcrun xcresulttool export attachments --path ui.xcresult --output-path shots-raw > /dev/null 2>&1 || true
          xcrun xcresulttool export attachments --path ui4.xcresult --output-path shots-raw4 > /dev/null 2>&1 || true
          python3 - <<'PY'
          import json, os, shutil
          n = 0
          for raw in ("shots-raw", "shots-raw4"):
              man = os.path.join(raw, "manifest.json")
              if not os.path.exists(man):
                  continue
              for test in json.load(open(man)):
                  for a in test.get("attachments", []):
                      src = os.path.join(raw, a.get("exportedFileName", ""))
                      name = (a.get("suggestedHumanReadableName") or a.get("exportedFileName") or "shot").split("_0_")[0]
                      if os.path.isfile(src):
                          ext = os.path.splitext(src)[1] or ".png"
                          shutil.copy(src, os.path.join("shots", name.replace("/", "-") + ext))
                          n += 1
          print("pictures:", n)
          PY
          xcrun xcresulttool get test-results tests --path ui.xcresult > shots/test-results.json 2>/dev/null || true
          xcrun xcresulttool get test-results tests --path ui4.xcresult > shots/test-results4.json 2>/dev/null || true
          cp uitest.log shots/uitest.log 2>/dev/null || true
          cp uitest4.log shots/uitest4.log 2>/dev/null || true
          cp split.mp4 shots/split.mp4 2>/dev/null || true
          cp rec.log shots/rec.log 2>/dev/null || true
          find ~/Library/Logs/DiagnosticReports -name "GymTracker*" -mmin -60 -exec cp {} shots/ \; 2>/dev/null || true
          ls -la shots

      - name: Publish the pictures
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find shots -type f -size 0 -delete
          mkdir -p video
          [ -f shots/split.mp4 ] && mv shots/split.mp4 video/split.mp4
          gh release delete ci-shots --yes --cleanup-tag || true
          gh release create ci-shots shots/* --prerelease --target "$GITHUB_SHA" \
            --title "CI: снимки из симулятора" --notes "Снимки нативных частей приложения из симулятора iPhone для коммита $GITHUB_SHA. Не для установки."
          # the screen recording of the «60/40» check goes on its own (big; a failed upload doesn't lose the pictures)
          if [ -f video/split.mp4 ]; then gh release upload ci-shots video/split.mp4 --clobber || echo "::warning title=video::upload failed"; fi

      - name: Fail when the checks failed
        if: always()
        run: |
          test "$(cat uitest.status 2>/dev/null)" = "0"
